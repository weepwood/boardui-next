name: 日常检查与风险专项
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      risk: ${{ steps.risk.outputs.risk }}
      routes: ${{ steps.risk.outputs.routes }}
      navigation: ${{ steps.risk.outputs.navigation }}
      matrix: ${{ steps.risk.outputs.matrix }}
      responsive: ${{ steps.risk.outputs.responsive }}
      rtlCompat: ${{ steps.risk.outputs.rtlCompat }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - id: risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_RISK: ${{ contains(github.event.pull_request.labels.*.name, 'high-risk') }}
        run: node scripts/classify-risk.mjs
  targeted:
    needs: quick
    if: needs.quick.outputs.risk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run test:api
      - run: npm run test:library
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run build:pages
      - run: npm run test:export
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --targeted ${{ (needs.quick.outputs.matrix == 'true' || needs.quick.outputs.responsive == 'true') && '--both-themes' || '' }}
        env:
          TARGET_ROUTES: ${{ needs.quick.outputs.routes }}
      - name: 持续动效资源释放专项
        run: node scripts/check-activity-cleanup.mjs /tmp/activity-cleanup.json
      - name: 导航与字体跨浏览器专项
        if: needs.quick.outputs.navigation == 'true'
        run: |
          node scripts/check-navigation-compat.mjs
          npx playwright install --with-deps firefox webkit
          BROWSER=firefox node scripts/check-navigation-compat.mjs
          BROWSER=webkit node scripts/check-navigation-compat.mjs
          BROWSER=firefox BROWSER_HEADED=1 TARGET_ROUTES='["/zh-hans/components/input/","/zh-hans/components/textarea/"]' xvfb-run -a npm run test:browser -- --targeted --both-themes
          BROWSER=webkit TARGET_ROUTES='["/zh-hans/components/input/","/zh-hans/components/textarea/"]' npm run test:browser -- --targeted --both-themes
      - name: WebKit 折叠与 RTL 回归
        if: needs.quick.outputs.rtlCompat == 'true'
        run: |
          npx playwright install --with-deps webkit
          BROWSER=webkit TARGET_ROUTES='["/zh-hans/components/accordion/","/zh-hans/rtl/"]' npm run test:browser -- --targeted --both-themes
      - name: 逐组件双主题视觉截图
        if: needs.quick.outputs.matrix == 'true'
        run: node scripts/audit-component-matrix.mjs acceptance/component-matrix --local-only
      - uses: actions/upload-artifact@v4
        if: always() && needs.quick.outputs.matrix == 'true'
        with:
          name: component-visual-matrix
          path: acceptance/component-matrix/
          if-no-files-found: warn
      - name: 全站初始状态 axe 与响应式验收
        if: needs.quick.outputs.responsive == 'true'
        run: |
          npm install --no-save --package-lock=false axe-core@4.10.3 playwright@1.56.1
          node scripts/audit-responsive-accessibility.mjs acceptance/responsive --local-only
      - uses: actions/upload-artifact@v4
        if: always() && needs.quick.outputs.responsive == 'true'
        with:
          name: responsive-accessibility
          path: acceptance/responsive/
          if-no-files-found: warn
      - name: 图表与独立工作区触摸及交互态 axe
        if: needs.quick.outputs.responsive == 'true'
        run: node scripts/check-chart-workspace.mjs acceptance/chart-workspace
      - uses: actions/upload-artifact@v4
        if: always() && needs.quick.outputs.responsive == 'true'
        with:
          name: chart-workspace-interaction
          path: acceptance/chart-workspace/
          if-no-files-found: warn
