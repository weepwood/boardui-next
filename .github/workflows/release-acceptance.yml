name: 正式版本完整验收
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm test
      - run: npm run build:pages
      - run: npm run test:export
      - uses: actions/upload-artifact@v4
        with:
          name: release-export
          path: out/
          retention-days: 3
  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-export
          path: out
      - run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --full
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.browser }}
          path: acceptance/
          if-no-files-found: warn
  release-gate:
    needs: [build, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:release
