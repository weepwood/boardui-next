name: 正式版本完整验收
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-pages-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run test:library
      - run: node scripts/audit-api-contracts.mjs acceptance/api-contracts.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-api-contracts
          path: acceptance/api-contracts.json
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run test:consumer
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:consumer:browser
      - run: npm run build:pages
      - run: npm run test:export
      - run: node scripts/acceptance-report.mjs --routes
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-routes
          path: acceptance/expected-routes.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-export
          path: out/
          retention-days: 3
  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-export
          path: out
      - run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          if [ "$BROWSER" = firefox ]; then
            BROWSER_HEADED=1 xvfb-run -a npm run test:browser -- --full
          else
            npm run test:browser -- --full
          fi
        env:
          BROWSER: ${{ matrix.browser }}
      - name: 初始态视觉基线候选及完整性检查
        if: matrix.browser == 'chromium'
        run: |
          node scripts/capture-visual-baseline.mjs acceptance/visual-candidate
          node scripts/verify-visual-candidate.mjs acceptance/visual-candidate
      - name: 关闭按钮双主题方向与状态专项
        if: matrix.browser == 'chromium'
        run: node scripts/audit-close-button.mjs acceptance/close-button
      - name: 基础按钮双主题方向与状态专项
        if: matrix.browser == 'chromium'
        run: node scripts/audit-button-family.mjs acceptance/button-family
      - name: 剩余交互及展示状态专项
        if: matrix.browser == 'chromium'
        run: node scripts/audit-remaining-interactions.mjs acceptance/remaining-interactions
      - name: 反馈与数据展示双主题视觉专项
        if: matrix.browser == 'chromium'
        run: node scripts/audit-feedback-visual.mjs acceptance/feedback-visual
      - name: 全组件 RTL 初始布局与 axe 审计
        if: matrix.browser == 'chromium'
        run: node scripts/audit-all-rtl.mjs acceptance/all-rtl
      - name: 图表与工作区触摸状态
        if: matrix.browser == 'chromium'
        run: node scripts/check-chart-workspace.mjs acceptance/chart-workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.browser }}
          path: acceptance/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report-${{ matrix.browser }}
          path: acceptance/report.json
          if-no-files-found: warn
  report:
    if: always()
    needs: [build, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-report-*
          path: acceptance/reports
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-routes
          path: acceptance/reports/acceptance-routes
      - run: node scripts/acceptance-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-summary
          path: acceptance/summary.json
          if-no-files-found: warn
  release-gate:
    needs: [build, browser, report]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:release
